[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pramana-notifications"
version = "0.1.0"
description = "Notification templates and adapters shared by Pramana API and OCR worker"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["python"]
