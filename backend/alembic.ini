[alembic]
# path to migration scripts
script_location = migrations

# database dialect and driver
sqlalchemy.url = driver://user:pass@localhost/dbname

# version location
version_locations = %(here)s/migrations/versions

# timezone to use when rendering the date
# within the migration file
# timezone = UTC

# max length of characters to apply to the
# version file name
# max_version_name_length = 32

# locale used when rendering the date
# within the migration file
# locale = en_US

# Template for new migration files
# file_template = %%(rev)s_%%(slug)s.py

# The set of patterns which match files to ignore
# during scanning of script_directory
# ignore_patterns = *

# The version table name
version_table = alembic_version

# The naming style for the version table
# version_table_naming = %%

# alembic config section
# The set of patterns which match files to ignore
# during scanning of script_directory

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated version scripts.  See the docs for further
# detail and examples

# format using "black" - use the console
# script = black.py:console_main
# fork_first = True

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S