AWSTemplateFormatVersion: "2010-09-09"
Description: Pramāṇa KYC Backend API (Person B)

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@v3
  "com.aws.cloudformation.Context":
    arch: FastAPI Lambda/API component consumes Person A network/storage/queue outputs and B database/Cognito/notification outputs
    must:
      - integrate once into the reviewed root stack; do not create a parallel shared API or network
      - Lambda uses private subnets; RDS secret is read only by its scoped execution role
      - API and worker status/queue/auth contracts must be agreed before integration
    ref:
      - at: README.md
        has: deployment order, required outputs, and migration runbook
        scope: integration
      - at: IMPLEMENTATION_HANDOFF.md
        has: unresolved authorizer/SMS contract and verification blockers
        scope: coordination

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  CustomerUserPoolId:
    Type: String
    Description: Cognito Customer User Pool ID

  ReviewerUserPoolId:
    Type: String
    Description: Cognito Reviewer User Pool ID

  CustomerAppClientId:
    Type: String
    Description: Cognito Customer App Client ID

  ReviewerAppClientId:
    Type: String
    Description: Cognito Reviewer App Client ID

  DocumentsBucket:
    Type: String
    Description: S3 bucket for KYC documents

  SQSQueueUrl:
    Type: String
    Description: SQS queue URL for OCR worker

  SQSQueueArn:
    Type: String
    Description: SQS queue ARN for least-privilege SendMessage permission

  SNSTopicArn:
    Type: String
    Description: SNS topic ARN for notifications

  SESSenderEmail:
    Type: String
    Description: SES sender email address

  RDSHost:
    Type: String
    Description: RDS PostgreSQL host

  RDSPort:
    Type: String
    Default: "5432"
    Description: RDS PostgreSQL port

  RDSDbName:
    Type: String
    Description: RDS database name

  DatabaseSecretArn:
    Type: String
    Description: Secrets Manager secret ARN for RDS username/password JSON

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Person A's private subnets for the backend Lambda

  BackendLambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Lambda security group allowed to connect to the database

  SESIdentityArn:
    Type: String
    Description: SES verified sender identity ARN

Transform: AWS::Serverless-2016-10-31

Resources:
  SharedNotificationsLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      com.aws.cloudformation.Context:
        why: Shares notification templates and the RDS CA bundle with the OCR worker.
        must:
          - Keep RDS hostname verification enabled.
        mutable: change-with-constraints
    Properties:
      LayerName: !Sub 'pramana-${Environment}-shared-notifications'
      Description: Shared notification implementation and RDS CA trust bundle.
      ContentUri: ../infra/shared/dist/layer
      CompatibleRuntimes:
        - python3.11
      CompatibleArchitectures:
        - x86_64

  BackendLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub pramana-kyc-backend-${Environment}
      Description: Pramāṇa KYC FastAPI backend (Person B)
      CodeUri: .
      Handler: app.main.handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          RDS_HOST: !Ref RDSHost
          RDS_PORT: !Ref RDSPort
          RDS_DB_NAME: !Ref RDSDbName
          RDS_SECRET_ARN: !Ref DatabaseSecretArn
          RDS_CA_BUNDLE: /opt/certs/global-bundle.pem
          COGNITO_CUSTOMER_POOL_ID: !Ref CustomerUserPoolId
          COGNITO_REVIEWER_POOL_ID: !Ref ReviewerUserPoolId
          COGNITO_APP_CLIENT_ID: !Ref CustomerAppClientId
          COGNITO_REVIEWER_APP_CLIENT_ID: !Ref ReviewerAppClientId
          S3_DOCUMENTS_BUCKET: !Ref DocumentsBucket
          SQS_QUEUE_URL: !Ref SQSQueueUrl
          SNS_TOPIC_ARN: !Ref SNSTopicArn
          SES_SENDER_EMAIL: !Ref SESSenderEmail
          API_BASE_URL: !Sub https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
      VpcConfig:
        SecurityGroupIds:
          - !Ref BackendLambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds
      Layers:
        - !Ref SharedNotificationsLayer
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !Ref SQSQueueArn
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref SNSTopicArn
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Ref SESIdentityArn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecretArn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub 'arn:aws:s3:::${DocumentsBucket}/documents/*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /{proxy+}
            Method: ANY
        RootApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /
            Method: ANY

  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub pramana-kyc-api-${Environment}
      StageName: !Ref Environment
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: Pramāṇa KYC API
          version: 1.0.0
        paths: {}

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  BackendLambdaArn:
    Description: Backend Lambda function ARN
    Value: !GetAtt BackendLambdaFunction.Arn
  ApiName:
    Description: API Gateway name for shared CloudWatch alarm wiring.
    Value: !Sub 'pramana-kyc-api-${Environment}'
