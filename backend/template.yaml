AWSTemplateFormatVersion: "2010-09-09"
Description: Pramāṇa KYC Backend API (Person B)

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@v3
  "com.aws.cloudformation.Context":
    arch: FastAPI Lambda/API component consumes Person A network/storage/queue outputs and B database/Cognito/notification outputs
    must:
      - integrate once into the reviewed root stack; do not create a parallel shared API or network
      - Lambda uses private subnets; RDS secret is read only by its scoped execution role
      - API Gateway auth boundary and SES sender identity must be agreed before deployment
    ref:
      - at: README.md
        has: deployment order, required outputs, and migration runbook
        scope: integration
      - at: IMPLEMENTATION_HANDOFF.md
        has: deployed resources, remaining connectivity/SES blockers, and verification state
        scope: coordination

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  CustomerUserPoolId:
    Type: String
    Description: Cognito Customer User Pool ID

  ReviewerUserPoolId:
    Type: String
    Description: Cognito Reviewer User Pool ID

  CustomerAppClientId:
    Type: String
    Description: Cognito Customer App Client ID

  ReviewerAppClientId:
    Type: String
    Description: Cognito Reviewer App Client ID

  CustomerUserPoolArn:
    Type: String
    Description: Customer user-pool ARN used to scope AdminGetUser after confirmation

  SharedNotificationsLayerArn:
    Type: String
    Description: Shared notifications and RDS CA Lambda layer ARN from Person A's foundation stack

  DocumentsBucket:
    Type: String
    Description: S3 bucket for KYC documents

  SQSQueueUrl:
    Type: String
    Description: SQS queue URL for OCR worker

  SQSQueueArn:
    Type: String
    Description: SQS queue ARN for least-privilege SendMessage permission

  SESSenderEmail:
    Type: String
    Description: SES sender email address

  RDSHost:
    Type: String
    Description: RDS PostgreSQL host

  RDSPort:
    Type: String
    Default: "5432"
    Description: RDS PostgreSQL port

  RDSDbName:
    Type: String
    Description: RDS database name

  DatabaseSecretArn:
    Type: String
    Description: Secrets Manager secret ARN for RDS username/password JSON

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Person A's private subnets for the backend Lambda

  BackendLambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Lambda security group allowed to connect to the database

  SESIdentityArn:
    Type: String
    Description: SES verified sender identity ARN

  FrontendOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Comma-separated browser origins allowed to call the API; use the deployed CloudFront origin in production.

Transform: AWS::Serverless-2016-10-31

Resources:
  BackendLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub pramana-kyc-backend-${Environment}
      Description: Pramāṇa KYC FastAPI backend (Person B)
      CodeUri: .
      Handler: app.main.handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          RDS_HOST: !Ref RDSHost
          RDS_PORT: !Ref RDSPort
          RDS_DB_NAME: !Ref RDSDbName
          RDS_SECRET_ARN: !Ref DatabaseSecretArn
          RDS_CA_BUNDLE: /opt/certs/global-bundle.pem
          COGNITO_CUSTOMER_POOL_ID: !Ref CustomerUserPoolId
          COGNITO_REVIEWER_POOL_ID: !Ref ReviewerUserPoolId
          COGNITO_APP_CLIENT_ID: !Ref CustomerAppClientId
          COGNITO_REVIEWER_APP_CLIENT_ID: !Ref ReviewerAppClientId
          S3_DOCUMENTS_BUCKET: !Ref DocumentsBucket
          SQS_QUEUE_URL: !Ref SQSQueueUrl
          SES_SENDER_EMAIL: !Ref SESSenderEmail
          FRONTEND_ORIGIN: !Ref FrontendOrigin
      VpcConfig:
        SecurityGroupIds:
          - !Ref BackendLambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds
        Ipv6AllowedForDualStack: true
      Layers:
        - !Ref SharedNotificationsLayerArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !Ref SQSQueueArn
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"
              Condition:
                StringEquals:
                  aws:RequestedRegion: !Ref AWS::Region
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
              Resource: !Ref CustomerUserPoolArn
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Ref SESIdentityArn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecretArn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub 'arn:aws:s3:::${DocumentsBucket}/documents/*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /{proxy+}
            Method: ANY
        RootApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /
            Method: ANY

  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub pramana-kyc-api-${Environment}
      StageName: !Ref Environment
      # Let SAM generate its OpenAPI proxy methods from the Function Api events.
      # FastAPI's CORSMiddleware handles OPTIONS and all browser CORS headers.

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  BackendLambdaArn:
    Description: Backend Lambda function ARN
    Value: !GetAtt BackendLambdaFunction.Arn
  ApiName:
    Description: API Gateway name for shared CloudWatch alarm wiring.
    Value: !Sub 'pramana-kyc-api-${Environment}'
