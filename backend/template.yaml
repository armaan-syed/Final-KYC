# Pramāṇa Backend — Person B (FastAPI + PostgreSQL + Cognito)

# Deployed via Person A's SAM template. This file describes the backend
# Lambda configuration for coordination only.

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Pramāṇa KYC Backend API (Person B)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  CustomerUserPoolId:
    Type: String
    Description: Cognito Customer User Pool ID

  ReviewerUserPoolId:
    Type: String
    Description: Cognito Reviewer User Pool ID

  CustomerAppClientId:
    Type: String
    Description: Cognito Customer App Client ID

  ReviewerAppClientId:
    Type: String
    Description: Cognito Reviewer App Client ID

  DocumentsBucket:
    Type: String
    Description: S3 bucket for KYC documents

  SQSQueueUrl:
    Type: String
    Description: SQS queue URL for OCR worker

  SNSTopicArn:
    Type: String
    Description: SNS topic ARN for notifications

  SESSenderEmail:
    Type: String
    Description: SES sender email address

  RDSHost:
    Type: String
    Description: RDS PostgreSQL host

  RDSPort:
    Type: String
    Default: "5432"
    Description: RDS PostgreSQL port

  RDSDbName:
    Type: String
    Description: RDS database name

  RDSUsername:
    Type: String
    Description: RDS database username

  RDSPassword:
    Type: String
    NoEcho: true
    Description: RDS database password

Resources:
  BackendLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub pramana-kyc-backend-${Environment}
      Description: Pramāṇa KYC FastAPI backend (Person B)
      CodeUri: ./backend/
      Handler: app.main.handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          AWS_REGION: !Ref AWS::Region
          RDS_HOST: !Ref RDSHost
          RDS_PORT: !Ref RDSPort
          RDS_DB_NAME: !Ref RDSDbName
          RDS_USERNAME: !Ref RDSUsername
          RDS_PASSWORD: !Ref RDSPassword
          COGNITO_CUSTOMER_POOL_ID: !Ref CustomerUserPoolId
          COGNITO_REVIEWER_POOL_ID: !Ref ReviewerUserPoolId
          COGNITO_APP_CLIENT_ID: !Ref CustomerAppClientId
          COGNITO_REVIEWER_APP_CLIENT_ID: !Ref ReviewerAppClientId
          S3_DOCUMENTS_BUCKET: !Ref DocumentsBucket
          SQS_QUEUE_URL: !Ref SQSQueueUrl
          SNS_TOPIC_ARN: !Ref SNSTopicArn
          SES_SENDER_EMAIL: !Ref SESSenderEmail
          API_BASE_URL: !Sub https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !Ref SQSQueueUrl
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref SNSTopicArn
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource:
                - !Sub arn:aws:s3:::${DocumentsBucket}/*
                - !Sub arn:aws:s3:::${DocumentsBucket}
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /{proxy+}
            Method: ANY

  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: pramana-kyc-api-${Environment}
      StageName: !Ref Environment
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: Pramāṇa KYC API
          version: 1.0.0
        paths: {}

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  BackendLambdaArn:
    Description: Backend Lambda function ARN
    Value: !GetAtt BackendLambdaFunction.Arn